[package]
name = "nyx-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dioxus.workspace = true
nyx-crypto = { path = "../nyx-crypto" }
nyx-store = { path = "../nyx-store" }
nyx-tor = { path = "../nyx-tor" }
nyx-protocol = { path = "../nyx-protocol" }
uuid.workspace = true
tokio.workspace = true
zeroize.workspace = true
dotenvy.workspace = true
qrcode.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
base64.workspace = true
blake3.workspace = true
jni = "0.21"
meshtastic = { version = "0.1.9", default-features = false }
ndk-context = "0.1"
manganis = "0.7.10"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
meshtastic = { version = "0.1.9", default-features = false, features = ["tokio"] }
blake3.workspace = true
dirs = "6"
